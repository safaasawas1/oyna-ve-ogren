<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف والتشكيل للأطفال - العب وتعلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #a8edf saturated, #fed6e3);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 6px solid #FFD166;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #FFF3B0;
            padding: 15px 25px;
            border-radius: 20px;
        }

        .score-board {
            font-size: 24px;
            font-weight: 900;
            color: #073B4C;
        }

        .star-icon {
            color: #FFD166;
            margin-right: 5px;
        }

        .character-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            background: #E8F1F2;
            padding: 15px;
            border-radius: 20px;
        }

        .character-avatar {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .character-dialog {
            font-size: 20px;
            font-weight: bold;
            color: #118AB2;
            background: white;
            padding: 10px 18px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .question-card {
            background: #06D6A0;
            color: white;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 #059e75;
        }

        .letter-display {
            font-size: 90px;
            font-weight: 900;
            line-height: 1.1;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            margin: 10px 0;
        }

        .instruction {
            font-size: 22px;
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #118AB2;
            color: white;
            border: none;
            padding: 18px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0c6482;
            transition: all 0.1s ease;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            background: #0f7a9d;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0c6482;
        }

        .option-btn.correct {
            background: #06D6A0 !important;
            box-shadow: 0 6px 0 #048a67 !important;
        }

        .option-btn.wrong {
            background: #EF476F !important;
            box-shadow: 0 6px 0 #b82345 !important;
        }

        .sound-btn {
            background: #FFD166;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cca33d;
            margin-bottom: 10px;
        }

        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cca33d;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <button class="sound-btn" onclick="playQuestionSound()" title="استمع للحرف">🔊</button>
        <div class="score-board">
            النقاط: <span id="score">0</span> ⭐
        </div>
    </div>

    <div class="character-box">
        <div class="character-avatar" id="avatar">🦁</div>
        <div class="character-dialog" id="dialog">أهلاً بك يا بطل! هل تعرف ما هو هذا الحرف مع الحركة؟</div>
    </div>

    <div class="question-card">
        <div class="instruction" id="question-text">اختر الصوت الصحيح للحرف:</div>
        <div class="letter-display" id="letter-display">بَ</div>
    </div>

    <div class="options-grid" id="options-container">
        <!-- الخيارات ستظهر هنا -->
    </div>
</div>

<script>
    // قائمة الحروف مع التشكيل والخيارات
    const questions = [
        { letter: 'أَ', text: 'أَ (فتحة)', options: ['أَ (فتحة)', 'أُ (ضمة)', 'إِ (كسرة)', 'أْ (سكون)'], correct: 0 },
        { letter: 'بُ', text: 'بُ (ضمة)', options: ['بَ (فتحة)', 'بُ (ضمة)', 'بِ (كسرة)', 'بْ (سكون)'], correct: 1 },
        { letter: 'تِ', text: 'تِ (كسرة)', options: ['تَ (فتحة)', 'تُ (ضمة)', 'تِ (كسرة)', 'تْ (سكون)'], correct: 2 },
        { letter: 'ثْ', text: 'ثْ (سكون)', options: ['ثَ (فتحة)', 'ثُ (ضمة)', 'ثِ (كسرة)', 'ثْ (سكون)'], correct: 3 },
        { letter: 'جَ', text: 'جَ (فتحة)', options: ['جَ (فتحة)', 'جُ (ضمة)', 'جِ (كسرة)', 'جْ (سكون)'], correct: 0 },
        { letter: 'حُ', text: 'حُ (ضمة)', options: ['حَ (فتحة)', 'حُ (ضمة)', 'حِ (كسرة)', 'حْ (سكون)'], correct: 1 },
        { letter: 'خِ', text: 'خِ (كسرة)', options: ['خَ (فتحة)', 'خُ (ضمة)', 'خِ (كسرة)', 'خْ (سكون)'], correct: 2 },
        { letter: 'دَ', text: 'دَ (فتحة)', options: ['دَ (فتحة)', 'دُ (ضمة)', 'دِ (كسرة)', 'دْ (سكون)'], correct: 0 },
        { letter: 'رُ', text: 'رُ (ضمة)', options: ['رَ (فتحة)', 'رُ (ضمة)', 'رِ (كسرة)', 'رْ (سكون)'], correct: 1 },
        { letter: 'سِ', text: 'سِ (كسرة)', options: ['سَ (فتحة)', 'سُ (ضمة)', 'سِ (كسرة)', 'سْ (سكون)'], correct: 2 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const dialogs = {
        correct: ["ممتاز يا بطل! 🌟", "إجابة رائعة! 👏", "أنت ذكي جداً! 🎉", "أحسنت القراءة! 🎈"],
        wrong: ["حاول مرة أخرى! 💪", "ركز جيداً في حركة الحرف! 🤔", "قريب جداً، جرب ثانية! ⭐"]
    };

    // إعداد الأصوات باستخدام Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    function playQuestionSound() {
        const currentQ = questions[currentQuestionIndex];
        const utterance = new SpeechSynthesisUtterance(currentQ.letter);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('letter-display').innerText = q.letter;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });

        // قراءة الحرف صوتياً تلقائياً
        setTimeout(playQuestionSound, 400);
    }

    function checkAnswer(selectedIndex, button) {
        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selectedIndex === q.correct) {
            button.classList.add('correct');
            playSound('correct');
            score += 10;
            document.getElementById('score').innerText = score;
            
            const randomDialog = dialogs.correct[Math.floor(Math.random() * dialogs.correct.length)];
            document.getElementById('dialog').innerText = randomDialog;

            setTimeout(() => {
                currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                loadQuestion();
            }, 1500);
        } else {
            button.classList.add('wrong');
            playSound('wrong');
            
            const randomDialog = dialogs.wrong[Math.floor(Math.random() * dialogs.wrong.length)];
            document.getElementById('dialog').innerText = randomDialog;

            setTimeout(() => {
                buttons.forEach(b => b.disabled = false);
                button.classList.remove('wrong');
            }, 1200);
        }
    }

    // بدء اللعبة
    loadQuestion();
</script>

</body>
</html>
