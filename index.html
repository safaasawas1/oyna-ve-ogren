<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ألعاب تعليمية ممتعة للأطفال بالعربية والتركية">
  <title>لَعِب وتَعَلَّم | Oyna ve Öğren</title>
  <style>
    :root {
      --ink: #24304a;
      --muted: #68738a;
      --pink: #ff7ba8;
      --yellow: #ffd166;
      --blue: #7bdff2;
      --green: #b2f7a1;
      --purple: #cdb4db;
      --paper: #fffdf8;
      --card: #ffffff;
      --shadow: 0 10px 28px rgba(36, 48, 74, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #fff3f7 0%, #f1fbff 48%, #fff9e8 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    button { font: inherit; cursor: pointer; }
    .wrap { width: min(1080px, 92%); margin: 0 auto; padding: 22px 0 42px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 18px; background: var(--yellow); font-size: 28px; box-shadow: var(--shadow); }
    h1 { font-size: clamp(1.25rem, 3vw, 1.8rem); margin: 0; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: .95rem; }
    .lang-btn, .back-btn { border: 0; background: white; border-radius: 999px; padding: 10px 16px; color: var(--ink); box-shadow: var(--shadow); font-weight: 700; }
    .hero { margin: 28px 0 22px; padding: clamp(22px, 5vw, 42px); border-radius: 28px; background: #ffffffc9; box-shadow: var(--shadow); text-align: center; }
    .hero .emoji { font-size: 44px; }
    .hero h2 { font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 6px 0 8px; }
    .hero p { color: var(--muted); margin: 0 auto 18px; max-width: 620px; line-height: 1.7; }
    .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .stat { background: #fff; border-radius: 999px; padding: 9px 15px; font-weight: 800; }
    .games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .game-card { border: 0; border-radius: 24px; padding: 22px 18px; text-align: start; box-shadow: var(--shadow); color: var(--ink); transition: transform .18s ease; min-height: 190px; }
    .game-card:hover { transform: translateY(-4px); }
    .game-card:nth-child(1) { background: #ffe0ec; }
    .game-card:nth-child(2) { background: #fff0bd; }
    .game-card:nth-child(3) { background: #dff8ff; }
    .game-icon { font-size: 42px; display: block; margin-bottom: 12px; }
    .game-card strong { display: block; font-size: 1.2rem; margin-bottom: 5px; }
    .game-card span:last-child { color: #566078; line-height: 1.5; }
    .panel { display: none; margin-top: 20px; padding: clamp(18px, 4vw, 32px); border-radius: 26px; background: white; box-shadow: var(--shadow); text-align: center; }
    .panel.active { display: block; }
    .panel h2 { margin: 8px 0; font-size: clamp(1.4rem, 4vw, 2rem); }
    .instruction { color: var(--muted); margin: 0 0 18px; }
    .prompt { background: #f6f7ff; border-radius: 20px; padding: 22px 12px; margin: 14px 0 18px; }
    .prompt .big { font-size: clamp(3rem, 13vw, 5rem); font-weight: 900; line-height: 1.15; }
    .prompt .small { color: var(--muted); margin-top: 8px; }
    .choices { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .choice { min-width: 82px; min-height: 70px; border: 3px solid transparent; border-radius: 18px; padding: 12px 18px; background: #f2f5ff; color: var(--ink); font-size: 1.35rem; font-weight: 900; }
    .choice:hover { border-color: var(--purple); }
    .choice:focus-visible, button:focus-visible { outline: 3px solid #6155d9; outline-offset: 3px; }
    .feedback { min-height: 32px; font-weight: 800; margin: 15px 0 6px; }
    .next-btn { border: 0; border-radius: 999px; padding: 12px 24px; background: var(--ink); color: white; font-weight: 800; margin-top: 8px; }
    .back-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .progress { color: var(--muted); font-weight: 700; }
    footer { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 28px; }
    [dir="ltr"] .game-card { text-align: left; }
    @media (max-width: 720px) { .games { grid-template-columns: 1fr; } .game-card { min-height: auto; } .hero { margin-top: 20px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🌈</div>
        <div>
          <h1 data-i18n="siteTitle">لَعِب وتَعَلَّم</h1>
          <p class="subtitle" data-i18n="siteSubtitle">Oyna ve Öğren</p>
        </div>
      </div>
      <button class="lang-btn" id="languageToggle" type="button">🇹🇷 Türkçe</button>
    </header>

    <section class="hero" id="homeHero">
      <div class="emoji" aria-hidden="true">🧸 ⭐ 🎨</div>
      <h2 data-i18n="welcome">نتعلّم ونلعب كل يوم!</h2>
      <p data-i18n="intro">ألعاب صغيرة وممتعة تساعد الأطفال على تعلّم الحروف والأرقام والحيوانات. اختاروا لعبة وابدؤوا المغامرة!</p>
      <div class="stats">
        <div class="stat">⭐ <span data-i18n="starsLabel">نجومي:</span> <span id="totalStars">0</span></div>
        <div class="stat">🎯 <span data-i18n="roundLabel">الجولات:</span> <span id="totalRounds">0</span></div>
      </div>
    </section>

    <main>
      <section class="games" id="gameMenu" aria-label="Games">
        <button class="game-card" data-game="letters" type="button">
          <span class="game-icon" aria-hidden="true">🔤</span>
          <strong data-i18n="lettersTitle">لعبة الحروف</strong>
          <span data-i18n="lettersDesc">اختر الحرف المطابق وتعلّم حرفاً جديداً.</span>
        </button>
        <button class="game-card" data-game="numbers" type="button">
          <span class="game-icon" aria-hidden="true">🔢</span>
          <strong data-i18n="numbersTitle">لعبة الأرقام</strong>
          <span data-i18n="numbersDesc">عدّ الأشياء واختر العدد الصحيح.</span>
        </button>
        <button class="game-card" data-game="animals" type="button">
          <span class="game-icon" aria-hidden="true">🐱</span>
          <strong data-i18n="animalsTitle">لعبة الحيوانات</strong>
          <span data-i18n="animalsDesc">تعرّف على الحيوان واختر اسمه.</span>
        </button>
      </section>

      <section class="panel" id="gamePanel" aria-live="polite">
        <div class="back-row">
          <button class="back-btn" id="backButton" type="button" data-i18n="back">← الألعاب</button>
          <span class="progress" id="progressText">1 / 5</span>
        </div>
        <h2 id="gameHeading">لعبة الحروف</h2>
        <p class="instruction" id="gameInstruction">اختر الإجابة الصحيحة</p>
        <div class="prompt">
          <div class="big" id="promptMain">أ</div>
          <div class="small" id="promptSub"></div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" role="status"></div>
        <button class="next-btn" id="nextButton" type="button" hidden>السؤال التالي ←</button>
      </section>
    </main>
    <footer data-i18n="footer">صُنع بحب للأطفال وأهلهم 💛</footer>
  </div>

  <script>
    const translations = {
      ar: {
        siteTitle: "لَعِب وتَعَلَّم", siteSubtitle: "Oyna ve Öğren",
        welcome: "نتعلّم ونلعب كل يوم!",
        intro: "ألعاب صغيرة وممتعة تساعد الأطفال على تعلّم الحروف والأرقام والحيوانات. اختاروا لعبة وابدؤوا المغامرة!",
        starsLabel: "نجومي:", roundLabel: "الجولات:",
        lettersTitle: "لعبة الحروف", lettersDesc: "اختر الحرف المطابق وتعلّم حرفاً جديداً.",
        numbersTitle: "لعبة الأرقام", numbersDesc: "عدّ الأشياء واختر العدد الصحيح.",
        animalsTitle: "لعبة الحيوانات", animalsDesc: "تعرّف على الحيوان واختر اسمه.",
        back: "← الألعاب", chooseLetter: "اختر الحرف المطابق", chooseNumber: "كم عدد الأشياء؟ اختر العدد الصحيح",
        chooseAnimal: "اختر اسم الحيوان الظاهر في الصورة", correct: "أحسنت! إجابة صحيحة ⭐",
        wrong: "محاولة جميلة! جرّب مرة أخرى 💪", next: "السؤال التالي ←",
        finish: "رائع! أنهيت هذه الجولة 🎉", again: "العب مرة أخرى", rounds: "السؤال",
        footer: "صُنع بحب للأطفال وأهلهم 💛", languageButton: "🇹🇷 Türkçe",
        lettersHeading: "لعبة الحروف", numbersHeading: "لعبة الأرقام", animalsHeading: "لعبة الحيوانات",
        lettersSub: "ابحث عن نفس الحرف", numberSub: "عدّ الرموز الظاهرة", animalSub: "ما اسم هذا الحيوان؟",
        animals: {cat:"قطة", dog:"كلب", rabbit:"أرنب", cow:"بقرة", fish:"سمكة", lion:"أسد"},
        objects: "أشياء", correctAnimal: "الحيوان الصحيح"
      },
      tr: {
        siteTitle: "Oyna ve Öğren", siteSubtitle: "لَعِب وتَعَلَّم",
        welcome: "Her gün öğrenelim ve oynayalım!",
        intro: "Harfleri, sayıları ve hayvanları öğrenmek için eğlenceli mini oyunlar. Bir oyun seç ve maceraya başla!",
        starsLabel: "Yıldızlarım:", roundLabel: "Turlar:",
        lettersTitle: "Harf Oyunu", lettersDesc: "Aynı harfi bul ve yeni bir harf öğren.",
        numbersTitle: "Sayı Oyunu", numbersDesc: "Nesneleri say ve doğru sayıyı seç.",
        animalsTitle: "Hayvan Oyunu", animalsDesc: "Hayvanı tanı ve doğru adını seç.",
        back: "← Oyunlar", chooseLetter: "Aynı harfi bul", chooseNumber: "Kaç nesne var? Doğru sayıyı seç",
        chooseAnimal: "Resimdeki hayvanın adını seç", correct: "Harika! Doğru cevap ⭐",
        wrong: "Güzel deneme! Tekrar dene 💪", next: "Sonraki soru →",
        finish: "Harika! Bu turu tamamladın 🎉", again: "Tekrar oyna", rounds: "Soru",
        footer: "Çocuklar ve aileleri için sevgiyle 💛", languageButton: "🇸🇦 العربية",
        lettersHeading: "Harf Oyunu", numbersHeading: "Sayı Oyunu", animalsHeading: "Hayvan Oyunu",
        lettersSub: "Aynı harfi bul", numberSub: "Sembolleri say", animalSub: "Bu hayvanın adı ne?",
        animals: {cat:"Kedi", dog:"Köpek", rabbit:"Tavşan", cow:"İnek", fish:"Balık", lion:"Aslan"},
        objects: "nesne", correctAnimal: "Doğru hayvan"
      }
    };

    const letterSets = {
      ar: ["أ","ب","ت","ث","ج","ح","د","ر","س","م"],
      tr: ["A","B","C","Ç","D","E","G","İ","K","M"]
    };
    const animalData = [
      {key:"cat", emoji:"🐱"}, {key:"dog", emoji:"🐶"}, {key:"rabbit", emoji:"🐰"},
      {key:"cow", emoji:"🐮"}, {key:"fish", emoji:"🐠"}, {key:"lion", emoji:"🦁"}
    ];
    let language = "ar";
    let currentGame = "letters";
    let questionIndex = 0;
    let currentQuestion = null;
    let answered = false;
    let stars = 0;
    let rounds = 0;
    const totalQuestions = 5;

    const $ = (id) => document.getElementById(id);
    const t = (key) => translations[language][key];

    function applyLanguage() {
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (translations[language][key]) el.textContent = translations[language][key];
      });
      $("languageToggle").textContent = t("languageButton");
      if ($("gamePanel").classList.contains("active")) {
        $("gameHeading").textContent = currentGame === "letters" ? t("lettersHeading") : currentGame === "numbers" ? t("numbersHeading") : t("animalsHeading");
        $("gameInstruction").textContent = currentGame === "letters" ? t("chooseLetter") : currentGame === "numbers" ? t("chooseNumber") : t("chooseAnimal");
        if (!answered) renderQuestion();
        else renderFeedbackAfterLanguageChange();
      }
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }
    function pickDifferent(correct, pool, count = 3) {
      return shuffle(pool.filter(item => item !== correct)).slice(0, count - 1).concat(correct).sort(() => Math.random() - 0.5);
    }
    function updateStats() {
      $("totalStars").textContent = stars;
      $("totalRounds").textContent = rounds;
    }
    function openGame(game) {
      currentGame = game;
      questionIndex = 0;
      $("gameMenu").style.display = "none";
      $("homeHero").style.display = "none";
      $("gamePanel").classList.add("active");
      $("gameHeading").textContent = game === "letters" ? t("lettersHeading") : game === "numbers" ? t("numbersHeading") : t("animalsHeading");
      $("gameInstruction").textContent = game === "letters" ? t("chooseLetter") : game === "numbers" ? t("chooseNumber") : t("chooseAnimal");
      makeQuestion();
    }
    function backHome() {
      $("gamePanel").classList.remove("active");
      $("gameMenu").style.display = "grid";
      $("homeHero").style.display = "block";
      updateStats();
    }
    function makeQuestion() {
      answered = false;
      $("feedback").textContent = "";
      $("nextButton").hidden = true;
      $("nextButton").textContent = questionIndex === totalQuestions - 1 ? t("finish") : t("next");
      $("progressText").textContent = `${questionIndex + 1} / ${totalQuestions}`;
      if (currentGame === "letters") {
        const pool = letterSets[language];
        const correct = pool[Math.floor(Math.random() * pool.length)];
        currentQuestion = { correct, choices: pickDifferent(correct, pool) };
      } else if (currentGame === "numbers") {
        const correct = Math.floor(Math.random() * 9) + 1;
        currentQuestion = { correct, choices: pickDifferent(correct, [1,2,3,4,5,6,7,8,9]) };
      } else {
        const correct = animalData[Math.floor(Math.random() * animalData.length)];
        currentQuestion = { correct, choices: shuffle(animalData.filter(a => a.key !== correct.key).slice(0, 2).concat(correct)) };
      }
      renderQuestion();
    }
    function renderQuestion() {
      if (!currentQuestion) return;
      const main = $("promptMain");
      const sub = $("promptSub");
      const choices = $("choices");
      choices.innerHTML = "";
      if (currentGame === "letters") {
        main.textContent = currentQuestion.correct;
        sub.textContent = t("lettersSub");
        currentQuestion.choices.forEach(value => addChoice(value, value));
      } else if (currentGame === "numbers") {
        main.textContent = "🍎 ".repeat(currentQuestion.correct).trim();
        main.style.fontSize = currentQuestion.correct > 5 ? "clamp(1.5rem, 7vw, 3rem)" : "";
        sub.textContent = t("numberSub");
        currentQuestion.choices.forEach(value => addChoice(value, value));
      } else {
        main.style.fontSize = "";
        main.textContent = currentQuestion.correct.emoji;
        sub.textContent = t("animalSub");
        currentQuestion.choices.forEach(animal => addChoice(animal.emoji + " " + translations[language].animals[animal.key], animal.key));
      }
    }
    function addChoice(label, value) {
      const button = document.createElement("button");
      button.className = "choice";
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", () => checkAnswer(value, button));
      $("choices").appendChild(button);
    }
    function checkAnswer(value, button) {
      if (answered) return;
      const correctValue = currentGame === "animals" ? currentQuestion.correct.key : currentQuestion.correct;
      if (String(value) === String(correctValue)) {
        answered = true;
        stars += 1;
        rounds += 1;
        $("feedback").textContent = t("correct");
        $("feedback").style.color = "#21834a";
        $("nextButton").hidden = false;
        document.querySelectorAll(".choice").forEach(b => b.disabled = true);
        updateStats();
      } else {
        $("feedback").textContent = t("wrong");
        $("feedback").style.color = "#bd4565";
        button.disabled = true;
      }
    }
    function renderFeedbackAfterLanguageChange() {
      $("feedback").textContent = t("correct");
      $("nextButton").textContent = questionIndex === totalQuestions - 1 ? t("finish") : t("next");
    }
    function nextQuestion() {
      if (questionIndex >= totalQuestions - 1) {
        $("feedback").textContent = t("finish");
        $("feedback").style.color = "#6155d9";
        $("nextButton").textContent = t("again");
        $("nextButton").onclick = () => { questionIndex = 0; makeQuestion(); };
        return;
      }
      questionIndex += 1;
      $("nextButton").onclick = null;
      makeQuestion();
    }

    $("languageToggle").addEventListener("click", () => {
      language = language === "ar" ? "tr" : "ar";
      applyLanguage();
    });
    document.querySelectorAll("[data-game]").forEach(button => button.addEventListener("click", () => openGame(button.dataset.game)));
    $("backButton").addEventListener("click", backHome);
    $("nextButton").addEventListener("click", nextQuestion);
    applyLanguage();
    updateStats();
  </script>
</body>
</html>
